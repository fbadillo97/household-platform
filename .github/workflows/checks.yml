name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Isolated PostgreSQL planning tests with fabricated records
        run: npm run test:planning:sql
      - name: Source import invariants with fabricated records
        run: node tests/planning/run-local.mjs supabase/tests/monarch.sql supabase/tests/payees.sql supabase/tests/payee_tags.sql supabase/tests/payee_websites.sql
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium --only-shell
      - name: Desktop and mobile browser checks with mock data
        run: npm run test:browser
      - name: Save mock browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-browser-diagnostics
          path: test-results/
          retention-days: 7
      - run: npm run build
