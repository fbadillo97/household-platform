name: Publish GitHub Pages
# Publish tested changes on main; manual publication is also available.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_BASE: /household-platform/
          VITE_SUPABASE_URL: https://bmdautqjcjekztnbegfl.supabase.co
          # Public client key only; never put a secret/service-role key here.
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_SX7r-mnBZ32kt7MDYorL2A_rNs7Odq3
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
